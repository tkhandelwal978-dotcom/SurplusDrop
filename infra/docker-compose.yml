# Local development services for SurplusDrop.
# Start: pnpm infra:up    Stop: pnpm infra:down
# Wipe all local data and re-run sql/ init scripts: pnpm infra:reset
# Ports bind to 127.0.0.1 so these password-less dev services are not reachable from the LAN.
name: surplusdrop

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sd-postgres
    environment:
      POSTGRES_USER: surplusdrop
      POSTGRES_PASSWORD: surplusdrop
      POSTGRES_DB: surplusdrop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount the file, not the folder: a folder mount would hide the image's own PostGIS init script.
      - ./sql/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surplusdrop -d surplusdrop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sd-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: sd-mailpit
    ports:
      - "127.0.0.1:1025:1025"   # SMTP: the app sends emails here
      - "127.0.0.1:8025:8025"   # Web inbox: open http://localhost:8025
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
